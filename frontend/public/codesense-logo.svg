<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Gradient Definitions -->
    <defs>
        <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
    </defs>

    <!-- Left Bracket < -->
    <path
        d="M 35 25 L 20 50 L 35 75"
        stroke="url(#codeGradient)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
    />

    <!-- Right Bracket > -->
    <path
        d="M 65 25 L 80 50 L 65 75"
        stroke="url(#codeGradient)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
    />

    <!-- Neural Network Pattern (Brain) -->
    <!-- Center node -->
    <circle cx="50" cy="50" r="4" fill="url(#brainGradient)" />
    
    <!-- Top nodes -->
    <circle cx="45" cy="35" r="3" fill="url(#brainGradient)" opacity="0.8" />
    <circle cx="55" cy="35" r="3" fill="url(#brainGradient)" opacity="0.8" />
    
    <!-- Bottom nodes -->
    <circle cx="45" cy="65" r="3" fill="url(#brainGradient)" opacity="0.8" />
    <circle cx="55" cy="65" r="3" fill="url(#brainGradient)" opacity="0.8" />
    
    <!-- Connections -->
    <line x1="50" y1="50" x2="45" y2="35" stroke="url(#brainGradient)" stroke-width="1.5" opacity="0.6" />
    <line x1="50" y1="50" x2="55" y2="35" stroke="url(#brainGradient)" stroke-width="1.5" opacity="0.6" />
    <line x1="50" y1="50" x2="45" y2="65" stroke="url(#brainGradient)" stroke-width="1.5" opacity="0.6" />
    <line x1="50" y1="50" x2="55" y2="65" stroke="url(#brainGradient)" stroke-width="1.5" opacity="0.6" />
    
    <!-- Cross connections -->
    <line x1="45" y1="35" x2="55" y2="65" stroke="url(#brainGradient)" stroke-width="1" opacity="0.3" />
    <line x1="55" y1="35" x2="45" y2="65" stroke="url(#brainGradient)" stroke-width="1" opacity="0.3" />
</svg>
