version: "3.9"

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesense_backend
    restart: unless-stopped
    environment:
      # LLM API Keys (set these in .env file)
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      
      # Performance Configuration
      - USE_PARALLEL_INDEXING=${USE_PARALLEL_INDEXING:-true}
      - INDEXING_MAX_WORKERS=${INDEXING_MAX_WORKERS:-0}
      - USE_PARALLEL_EMBEDDINGS=${USE_PARALLEL_EMBEDDINGS:-false}
      - PARALLEL_EMBEDDING_THRESHOLD=${PARALLEL_EMBEDDING_THRESHOLD:-5000}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-500}
      - MAX_WORKERS=${MAX_WORKERS:-8}
      
      # Production Settings
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
      
    ports:
      - "5000:5000"
    volumes:
      # Persist indexes and histories
      - ./backend/indexes:/app/indexes
      - ./backend/histories:/app/histories
      # Cache embedding models
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - codesense_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    container_name: codesense_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codesense_network

volumes:
  model_cache:
    driver: local

networks:
  codesense_network:
    driver: bridge
